# TLS-terminating reverse proxy skeleton for Xenior.
# Mount certificates at /etc/nginx/certs/fullchain.pem and privkey.pem.

upstream xenior_web {
  server web:3000;
}

upstream xenior_admin {
  server admin:3002;
}

upstream xenior_api {
  server api:3001;
}

server {
  listen 80;
  server_name _;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  server_name _;

  ssl_certificate /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  location /api/ {
    proxy_pass http://xenior_api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /admin/ {
    proxy_pass http://xenior_admin/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }

  location / {
    proxy_pass http://xenior_web;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }
}
