# Üretim yığını. Tüm yapılandırma tek dosyadan gelir:
#   docker/.env.production  (şablon: .env.production.example, git'te yok)
#
# Çalıştırma (docker/ dizininden):
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d
#
# --env-file hem ${...} değişken ikamesini (postgres, build args) hem de
# api/env_file ile kapsayıcı ortamını besler. Gerçek kimlik bilgileri asla
# commit edilmez.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-xenior}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}
      POSTGRES_DB: ${POSTGRES_DB:-xenior}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Yalnızca sunucunun kendisinden erişim: migrasyon, yedek (pg_dump) ve
    # süper admin script'i hosttan çalışır; dışarıya açık değildir.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Tüm sağlayıcı anahtarları ve URL'ler .env.production dosyasından
    # geçer; api servisi doğrulama (env schema) açılmayı reddeder.
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      API_PORT: 3001
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/api/v1/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    expose:
      - "3001"

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL gerekli}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      # Sitemap/robots/OG kanonik adresi çalışma zamanında okunur.
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    expose:
      - "3000"

  admin:
    build:
      context: ..
      dockerfile: docker/Dockerfile.admin
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    expose:
      - "3002"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
      - web
      - admin
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN:?WEB_DOMAIN gerekli}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?ADMIN_DOMAIN gerekli}
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN gerekli}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # nginx:alpine şablonu envsubst ile işleyip conf.d/default.conf üretir.
      - ./nginx/xenior.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/certs:/etc/nginx/certs:ro

volumes:
  postgres_data:
  redis_data:
